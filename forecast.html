<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 30px;
        }
        h2 {
            color: #d32f2f;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }
        caption {
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
        }
        th, td {
            border: 1px solid #555;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #d32f2f;
            color: white;
        }
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tbody tr:hover {
            background-color: #ffe0e0;
        }
        tfoot {
            font-weight: bold;
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <h2>Region-wise Temperature & Forecast</h2>
    <table>
        <caption>Heatwave Forecast Report</caption>
        <thead>
            <tr>
                <th colspan="2">Region Details</th>
                <th colspan="2">Forecast</th>
            </tr>
            <tr>
                <th>Region</th>
                <th>Station</th>
                <th>Max Temperature</th>
                <th>Severity Level</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>North</td>
                <td>Delhi</td>
                <td>45°C</td>
                <td>High</td>
            </tr>
            <tr>
                <td>Central</td>
                <td>Bhopal</td>
                <td>42°C</td>
                <td>Medium</td>
            </tr>
            <tr>
                <td>South</td>
                <td>Hyderabad</td>
                <td>40°C</td>
                <td>Low</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Total Regions: 3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
