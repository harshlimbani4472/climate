<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heatwave Media & Awareness</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: white;
            background-color: #d32f2f;
            padding: 15px;
            border: 2px solid #8b0000;
        }
        h2 {
            color: #d32f2f;
        }
        video, audio, iframe {
            margin: 10px;
            border: 2px solid #555;
            border-radius: 8px;
        }
        video:hover, iframe:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <h1>Heatwave Media & Awareness</h1>
    <h2>Awareness Video</h2>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
    </video>
    <h2>Audio Advisory</h2>
    <audio controls>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
                type="audio/mpeg">
    </audio>
    <h2>Map (IMD Site)</h2>
    <iframe src="https://mausam.imd.gov.in"
            width="500"
            height="300"
            title="IMD Website">
    </iframe>
    <noscript>
        <p>Please enable JavaScript.</p>
    </noscript>
</body>
</html>
